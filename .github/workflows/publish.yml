# Drive → content/ → build → Cloudflare Pages. Only started by hand: "Hjemmeside → Publicér nu" in the
# admin's sheet (repository_dispatch, scripts/apps-script/publicer.gs) or "Run workflow" here.
# Setup and secrets: docs/drift.md.
name: Publicér
on:
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
    inputs:
      allow_mass_removal:
        description: Tillad at hele sektioner eller mere end halvdelen af en sektion fjernes
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Kun tilladte brugere
        env:
          ACTOR: ${{ github.actor }}
          ALLOWED: ${{ vars.PUBLISH_ACTORS || github.repository_owner }}
          REQUESTED_BY: ${{ github.event.client_payload.requested_by }}
        run: |
          case ",${ALLOWED// /}," in
            *",$ACTOR,"*) echo "Startet af $ACTOR${REQUESTED_BY:+ for $REQUESTED_BY}" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::$ACTOR må ikke publicere (PUBLISH_ACTORS)"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      # Read-only Google access as the service account. Keyless (workload identity) when the
      # variables are set, otherwise the JSON key in GCP_SA_KEY.
      - id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: false
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/documents.readonly
      - name: Synkronisér, commit og byg
        id: publish
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          # From "Run workflow" or from "Publicér og tillad sletning" in the admin's sheet.
          MASS: ${{ (inputs.allow_mass_removal || github.event.client_payload.allow_mass_removal == true) && '--allow-mass-removal' || '' }}
        run: |
          if [ -n "$MASS" ]; then echo "Sletning tilladt for denne kørsel." >> "$GITHUB_STEP_SUMMARY"; fi
          umask 077; printf '%s' "$TOKEN" > "$RUNNER_TEMP/google-token"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          GOOGLE_ACCESS_TOKEN_FILE="$RUNNER_TEMP/google-token" bun run publish -- $MASS
          code=$?
          set -e
          rm -f "$RUNNER_TEMP/google-token"
          [ -f .sync/report.md ] && cat .sync/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -ne 1 ]
      - name: Push content/
        run: git push origin HEAD
      # Cloudflare Pages switches to the new version at once and keeps the old ones for rollback.
      - name: Upload til Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'gvnewweb' }}
        run: |
          # The first run creates the project; later runs only report that it exists.
          bunx wrangler@4 pages project create "$PROJECT" --production-branch=main || true
          bunx wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
      - name: Enkelte filer fejlede
        if: steps.publish.outputs.code == '2'
        run: |
          echo "::error::Sitet er opdateret, men enkelte filer fejlede. Se rapporten i oversigten."
          exit 1
